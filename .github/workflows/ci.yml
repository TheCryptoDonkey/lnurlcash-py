name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the mock mint is a Node process from the conformance repo, and the
      # vectors come from there too
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: lnurlcash/lnurlcash-conformance
          # Pinned. Unpinned, a merge in that repo turns this repo's main red
          # with no commit here - which is exactly what happened when the
          # spent-hash contract landed. Moving this line is how the grade gets
          # named, the same way moneyer and notecase pin the npm version.
          ref: v0.15.0
          path: conformance
      # the mock mint is a Node process with its own dependencies - without
      # these the adversarial suite cannot start it
      - run: npm ci
        working-directory: conformance
      - run: pip install -e '.[dev]'
      - run: pip install --upgrade build && python -m build
      - run: pytest -q
        env:
          LNURLCASH_CONFORMANCE: ${{ github.workspace }}/conformance
