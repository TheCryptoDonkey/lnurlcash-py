[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lnurlcash-kit"
version = "0.2.0"
description = "LNURLcash (LUD-25) bearer note client for Python - mint, rotate, split, merge, melt, and verify offline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "TheCryptoDonkey"}]
keywords = ["lnurl", "lnurlcash", "lud-25", "lightning", "bitcoin", "bearer", "ecash"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "coincurve>=18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/lnurlcash/lnurlcash-py"
Source = "https://github.com/lnurlcash/lnurlcash-py"
Issues = "https://github.com/lnurlcash/lnurlcash-py/issues"
Changelog = "https://github.com/lnurlcash/lnurlcash-py/blob/main/CHANGELOG.md"
Specification = "https://github.com/lnurl/luds/pull/301"

[tool.hatch.build.targets.wheel]
packages = ["src/lnurlcash_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "THREAT-MODEL.md", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
